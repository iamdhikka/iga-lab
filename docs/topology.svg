<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="840" viewBox="0 0 1380 840" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
  <title>iga-lab topology</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#3D4A56"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B7791F"/>
    </marker>
  </defs>

  <rect width="1380" height="840" fill="#EEF3F0"/>

  <!-- header -->
  <text x="24" y="44" font-size="24" font-weight="800" fill="#1B2733">iga-lab topology</text>
  <text x="24" y="68" font-size="13.5" fill="#64717C">Four containers on one Docker network. Only three ports are published, and only on 127.0.0.1.</text>
  <g font-size="12.5" fill="#3D4A56">
    <line x1="930" y1="52" x2="968" y2="52" stroke="#3D4A56" stroke-width="2" marker-end="url(#arr)"/>
    <text x="976" y="56">network connection</text>
    <line x1="1110" y1="52" x2="1148" y2="52" stroke="#B7791F" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrv)"/>
    <text x="1156" y="56">shared volume (read-only)</text>
  </g>

  <!-- laptop -->
  <rect x="24" y="96" width="250" height="720" rx="22" fill="#FFFFFF"/>
  <text x="44" y="128" font-size="14" font-weight="700" fill="#1B2733">Your laptop</text>
  <text x="44" y="147" font-size="12" fill="#64717C">Windows + Docker Desktop</text>

  <g>
    <rect x="40" y="168" width="218" height="72" rx="14" fill="#F5F8F6"/>
    <text x="56" y="196" font-size="14" font-weight="700" fill="#1B2733">Browser</text>
    <text x="56" y="218" font-size="12" fill="#64717C">http://localhost:8080</text>
  </g>
  <g>
    <rect x="40" y="478" width="218" height="72" rx="14" fill="#F5F8F6"/>
    <text x="56" y="506" font-size="14" font-weight="700" fill="#1B2733">LDAP browser, e2e test</text>
    <text x="56" y="528" font-size="12" fill="#64717C">ldaps://localhost:6360</text>
  </g>
  <g>
    <rect x="40" y="716" width="218" height="72" rx="14" fill="#F5F8F6"/>
    <text x="56" y="744" font-size="14" font-weight="700" fill="#1B2733">MySQL Workbench, Grafana</text>
    <text x="56" y="766" font-size="12" fill="#64717C">127.0.0.1:3307, iga_reader</text>
  </g>

  <!-- docker network -->
  <rect x="304" y="96" width="846" height="720" rx="26" fill="#E3ECE7" stroke="#B9CCC3" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="330" y="128" font-size="14" font-weight="700" fill="#1B2733">Docker network "lab"</text>
  <text x="330" y="147" font-size="12" fill="#64717C">Containers find each other by name: dc1.corp.lab, mysql</text>

  <!-- internet -->
  <rect x="1174" y="96" width="182" height="160" rx="22" fill="#FFFFFF" stroke="#DCE4E0" stroke-dasharray="5 5"/>
  <text x="1192" y="128" font-size="14" font-weight="700" fill="#1B2733">Internet</text>
  <text x="1192" y="147" font-size="12" fill="#64717C">optional</text>
  <rect x="1190" y="166" width="150" height="70" rx="14" fill="#F5F8F6"/>
  <text x="1204" y="194" font-size="13.5" font-weight="700" fill="#1B2733">Telegram Bot</text>
  <text x="1204" y="215" font-size="12" fill="#64717C">critical/high alerts</text>

  <!-- ===== edges (drawn under cards) ===== -->
  <g fill="none" stroke="#3D4A56" stroke-width="2" stroke-linejoin="round">
    <!-- browser -> portal -->
    <path d="M258 204 H574" marker-end="url(#arr)"/>
    <!-- ldap browser -> dc1 -->
    <path d="M258 514 H338" marker-end="url(#arr)"/>
    <!-- workbench -> mysql -->
    <path d="M258 752 H1050 V608" marker-end="url(#arr)"/>
    <!-- portal -> dc1 -->
    <path d="M640 284 V318 H489 V420" marker-end="url(#arr)"/>
    <!-- portal -> mysql -->
    <path d="M820 284 V318 H975 V420" marker-end="url(#arr)"/>
    <!-- lab-activity -> dc1 -->
    <path d="M640 670 H489 V608" marker-end="url(#arr)"/>
    <!-- lab-activity -> mysql -->
    <path d="M824 670 H930 V608" marker-end="url(#arr)"/>
    <!-- portal -> telegram -->
    <path d="M870 204 H1186" marker-end="url(#arr)"/>
  </g>
  <!-- audit volume: dc1 writes, portal reads -->
  <path d="M624 478 H730 V288" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrv)"/>

  <!-- published ports on the network edge -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="270" y="191" width="68" height="26" rx="13" fill="#0F6B5E"/>
    <text x="304" y="208.5" fill="#FFFFFF">:8080</text>
    <rect x="270" y="501" width="68" height="26" rx="13" fill="#0F6B5E"/>
    <text x="304" y="518.5" fill="#FFFFFF">:6360</text>
    <rect x="270" y="739" width="68" height="26" rx="13" fill="#0F6B5E"/>
    <text x="304" y="756.5" fill="#FFFFFF">:3307</text>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#3D4A56">
    <rect x="378" y="174" width="150" height="22" rx="11" fill="#E3ECE7"/>
    <text x="453" y="189.5" text-anchor="middle">HTTP, sign in with AD</text>

    <text x="501" y="362">LDAPS 636 as svc-iga</text>
    <text x="501" y="379" fill="#64717C">write access to OU=Corp only</text>

    <text x="987" y="362">TCP 3306 as iga_app</text>
    <text x="987" y="379" fill="#64717C">read/write database iga</text>

    <text x="742" y="398" fill="#7A4F0F" font-weight="700">audit volume</text>
    <text x="742" y="414" fill="#7A4F0F">auth.json, group.json</text>

    <text x="500" y="662" fill="#64717C">simulated sign-ins</text>
    <text x="842" y="662" fill="#64717C">employee list</text>
    <text x="842" y="744" fill="#64717C">read-only account, SELECT only</text>

    <rect x="928" y="180" width="200" height="22" rx="11" fill="#E3ECE7"/>
    <text x="1028" y="195.5" text-anchor="middle">HTTPS 443, outbound only</text>
  </g>

  <!-- ===== containers ===== -->
  <!-- portal -->
  <g>
    <rect x="574" y="164" width="296" height="120" rx="18" fill="#FFFFFF"/>
    <rect x="574" y="164" width="6" height="120" rx="3" fill="#0F6B5E"/>
    <text x="596" y="194" font-size="16" font-weight="800" fill="#1B2733">iga-portal</text>
    <text x="596" y="214" font-size="12.5" fill="#3D4A56">FastAPI web + background worker</text>
    <text x="596" y="240" font-size="12" fill="#64717C">JML, requests, reviews, detections</text>
    <text x="596" y="262" font-size="12" fill="#64717C">runs as non-root (uid 10001)</text>
  </g>
  <!-- dc1 -->
  <g>
    <rect x="338" y="420" width="286" height="188" rx="18" fill="#FFFFFF"/>
    <rect x="338" y="420" width="6" height="188" rx="3" fill="#5B3FA6"/>
    <text x="360" y="450" font-size="16" font-weight="800" fill="#1B2733">iga-dc1</text>
    <text x="360" y="470" font-size="12.5" fill="#3D4A56">Samba AD DC, dc1.corp.lab</text>
    <text x="360" y="496" font-size="12" fill="#64717C">LDAPS 636 with lab CA certificate</text>
    <text x="360" y="514" font-size="12" fill="#64717C">JSON audit log: sign-ins, group changes</text>
    <g font-size="11.5" font-weight="600">
      <rect x="360" y="534" width="88" height="22" rx="11" fill="#EDF1EF"/><text x="404" y="549" text-anchor="middle" fill="#3D4A56">samba_data</text>
      <rect x="454" y="534" width="44" height="22" rx="11" fill="#EDF1EF"/><text x="476" y="549" text-anchor="middle" fill="#3D4A56">tls</text>
      <rect x="504" y="534" width="58" height="22" rx="11" fill="#FCF0DA"/><text x="533" y="549" text-anchor="middle" fill="#7A4F0F">audit</text>
    </g>
    <text x="360" y="584" font-size="11.5" fill="#64717C">volumes</text>
  </g>
  <!-- mysql -->
  <g>
    <rect x="830" y="420" width="290" height="188" rx="18" fill="#FFFFFF"/>
    <rect x="830" y="420" width="6" height="188" rx="3" fill="#1D5FD1"/>
    <text x="852" y="450" font-size="16" font-weight="800" fill="#1B2733">iga-mysql</text>
    <text x="852" y="470" font-size="12.5" fill="#3D4A56">MySQL 8.4 LTS, database iga</text>
    <text x="852" y="496" font-size="12" fill="#64717C">iga_app: read/write, no DROP/GRANT</text>
    <text x="852" y="514" font-size="12" fill="#64717C">iga_reader: SELECT only</text>
    <g font-size="11.5" font-weight="600">
      <rect x="852" y="534" width="88" height="22" rx="11" fill="#EDF1EF"/><text x="896" y="549" text-anchor="middle" fill="#3D4A56">mysql_data</text>
    </g>
    <text x="852" y="584" font-size="11.5" fill="#64717C">volume</text>
  </g>
  <!-- lab-activity -->
  <g>
    <rect x="640" y="634" width="184" height="72" rx="16" fill="#FFFFFF" stroke="#DCE4E0" stroke-dasharray="5 4"/>
    <text x="658" y="662" font-size="14" font-weight="800" fill="#1B2733">lab-activity</text>
    <text x="658" y="682" font-size="12" fill="#64717C">lab only: logins, attacks</text>
  </g>
</svg>
